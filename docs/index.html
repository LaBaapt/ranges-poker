<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ranges de poker</title>
<meta name="theme-color" content="#0B1821">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ranges">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F3; --surface:#FFFFFF; --ink:#142330; --muted:#566A78; --line:#C6D3DB; --accent:#14506B; --on-accent:#FFFFFF;
  --c-fold:#BBDEFB; --c-hors:#DCE2E6; --hors-ink:#8A99A3;
  --bad:#D1331F; --good:#1E8A3A; --part:#E08A00;
  --hero:#3DD16F; --villain:#4AA8F0;
  --card-bg:#FFFFFF; --card-ink:#16202A; --card-h:#D6322A; --card-d:#2A6FDB; --card-c:#1E8E3E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1821; --surface:#12232E; --ink:#E4EDF2; --muted:#8CA3B1; --line:#254051; --accent:#6FC2E3; --on-accent:#08202B;
    --c-hors:#2A3A45; --hors-ink:#6F8494; --bad:#FF6B57; --good:#5ED17E;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1821; --surface:#12232E; --ink:#E4EDF2; --muted:#8CA3B1; --line:#254051; --accent:#6FC2E3; --on-accent:#08202B;
  --c-hors:#2A3A45; --hors-ink:#6F8494; --bad:#FF6B57; --good:#5ED17E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,select{font:inherit;color:inherit}
.app{max-width:1000px;margin:0 auto;padding:12px 12px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:2px;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.layout{display:grid;gap:16px}
.left{display:grid;gap:12px;min-width:0;align-content:start}
@media (min-width:860px){.layout{grid-template-columns:minmax(0,560px) minmax(0,1fr);align-items:start}}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:inline-flex;align-items:center;gap:8px;font-weight:500}
select{font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Table */
.table{position:relative;aspect-ratio:1.75/1;width:100%;max-width:560px;margin:0 auto}
.rail{position:absolute;inset:12% 1%;border-radius:999px;background:linear-gradient(180deg,#2B3238,#0A0C0E);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.felt{position:absolute;inset:calc(12% + 7px) calc(1% + 7px);border-radius:999px;background:radial-gradient(ellipse at 50% 40%,#13788A,#0A4455 75%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),inset 0 4px 14px rgba(0,0,0,.35)}
.pot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#D8F1F6;font-weight:600;font-size:14px;line-height:1.2;pointer-events:none;background:rgba(0,0,0,.28);padding:3px 12px;border-radius:12px;white-space:nowrap}
.pot small{display:block;font-weight:500;font-size:12px;opacity:.85}
.seat{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 50% 35%,#4A525A,#15191D);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 0 0 2px rgba(255,255,255,.18),0 2px 5px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent}
.seat.hero{box-shadow:0 0 0 3px var(--hero),0 2px 6px rgba(0,0,0,.4)}
.seat.villain{box-shadow:0 0 0 3px var(--villain),0 2px 6px rgba(0,0,0,.4)}
.seat.dim{opacity:.42}
.seat:focus-visible{outline:2px solid #fff;outline-offset:3px}
.sim .seat{cursor:default}
.bet{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.42);padding:1px 8px;border-radius:999px;pointer-events:none;white-space:nowrap}
.bet.act{background:rgba(0,0,0,.62);box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.cap{max-width:560px;margin:2px auto 0;font-size:15px;color:var(--muted)}
.cap b{font-weight:700}
.cap .ph{color:var(--good)} .cap .pv{color:var(--villain)}
.sits{display:flex;flex-wrap:wrap;gap:6px;max-width:560px;margin:6px auto 0}
.sit{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;font-weight:500;text-align:left}
.sit[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.sit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Grille */
.rtitle{margin:0 0 8px;font-size:21px;font-weight:700}
.rtitle small{font-size:15px;font-weight:500;color:var(--muted);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;user-select:none;-webkit-user-select:none}
.build .grid.paintable{touch-action:none}
.cell{aspect-ratio:1;border:0;padding:0;border-radius:5px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:0;
  font:600 clamp(9px,2.9vw,13px)/1 "Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.14)}
.cell.light{color:#20313C;text-shadow:none}
.cell.hors{background:var(--c-hors)!important;color:var(--hors-ink);text-shadow:none;box-shadow:none}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.cell.wrong{box-shadow:inset 0 0 0 2.5px var(--bad)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px;z-index:3}

/* Panneau */
.panel{display:grid;gap:14px;align-content:start;min-width:0}
.block{border-top:1px solid var(--line);padding-top:12px}
.block:first-child{border-top:0;padding-top:0}
.block h2{margin:0 0 8px;font-size:17px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.leg,.row{display:flex;align-items:center;gap:10px;padding:3px 0}
.sw{flex:0 0 auto;width:18px;height:18px;border-radius:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.14)}
.leg .name,.row .name{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.hand{font-size:36px;font-weight:700;line-height:1}
.hand small{font-size:15px;font-weight:500;color:var(--muted);margin-left:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols h3{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--muted)}
.brushes,.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.brush,.ans{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;cursor:pointer;text-align:left;min-width:0}
.brush span,.ans span{min-width:0;overflow-wrap:anywhere}
.brush[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.ans:disabled{cursor:default;opacity:.55}
.ans.ok{opacity:1;border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good);font-weight:600}
.ans.ko{opacity:1;border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad);font-weight:600}
.ans .mk{margin-left:auto;font-weight:700}
.ans.ok .mk{color:var(--good)}.ans.ko .mk{color:var(--bad)}
.ctrlrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn:focus-visible,.brush:focus-visible,.ans:focus-visible,.seg button:focus-visible,.tag:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{display:flex;align-items:baseline;gap:6px}
.score .big{font-size:64px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.score .pct{font-size:24px;font-weight:600;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:14px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.err{margin-top:10px}
.err b{font-weight:600}
details summary{cursor:pointer;color:var(--muted)}
details p{margin:6px 0 0}
.empty p{margin:0 0 8px}
.notice{border:1px solid var(--line);border-left:4px solid var(--part);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--surface)}

/* Simulateur */
.deal{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.pc{position:relative;width:62px;height:88px;border-radius:9px;background:var(--card-bg);color:var(--card-ink);border:1px solid rgba(0,0,0,.18);box-shadow:0 2px 6px rgba(0,0,0,.2);flex:0 0 auto}
.pc b{position:absolute;left:7px;top:5px;font-size:27px;line-height:1;font-weight:700}
.pc i{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-style:normal;font-size:40px;line-height:1}
.pc.s-h{color:var(--card-h)}.pc.s-d{color:var(--card-d)}.pc.s-c{color:var(--card-c)}
.dealinfo{min-width:0}
.dealinfo .hand{font-size:30px}
.fb{margin-top:14px;padding-left:12px;border-left:4px solid var(--line);font-size:17px}
.fb.ok{border-color:var(--good)}.fb.part{border-color:var(--part)}.fb.ko{border-color:var(--bad)}
.fb b{font-weight:700}
.hist .hh{font-weight:700;min-width:38px}
.good{color:var(--good)}.badc{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s ease}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Ranges</h1>
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" id="m-view" aria-pressed="true">Consulter</button>
      <button type="button" id="m-build" aria-pressed="false">Construire</button>
      <button type="button" id="m-sim" aria-pressed="false">Simulateur</button>
    </div>
  </div>
  <div class="layout" id="layout">
    <div class="left">
      <div class="ctl" id="ctl"></div>
      <div id="tablewrap"></div>
      <div id="main">
        <div id="mtop"></div>
        <div id="gridbox"><div class="grid" id="grid" role="group" aria-label="Grille des mains"></div></div>
      </div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

let simCfg = {depth: 'all', type: 'all', noPureFold: false};
let session = {n: 0, pts: 0, log: []};

function curRange() {
  if (!hero) return null;
  const list = rangesFor(depth, hero, villain);
  if (!list.length) return null;
  return list.find(r => r.key === sitKey) || list[0];
}
const rng = () => mode === 'sim' ? sim.range : curRange();
const attempt = () => { const r = rng(); return (store.attempts[r.key] = store.attempts[r.key] || {}); };

const gridEl = document.getElementById('grid');
const gridBoxEl = document.getElementById('gridbox');
const panelEl = document.getElementById('panel');
const ctlEl = document.getElementById('ctl');
const tableEl = document.getElementById('tablewrap');
const mtopEl = document.getElementById('mtop');
const layoutEl = document.getElementById('layout');

/* Cases */
function cellStyle(map, r) {
  const segs = []; let used = 0;
  const nonFold = r.actions.filter(a => a.id !== 'fold').reverse();
  for (const a of nonFold) { const f = map[a.id] || 0; if (f > 0) { segs.push([a.id, f]); used += f; } }
  const fold = 1 - used; if (fold > 0.001) segs.push(['fold', fold]);
  const col = id => r.color[id] || 'var(--c-fold)';
  if (segs.length === 1) return {bg: col(segs[0][0]), light: textColor(r.color[segs[0][0]] || '#BBDEFB')};
  let pos = 0; const stops = [];
  for (const [id, f] of segs) { const s = pos * 100; pos += f; stops.push(col(id) + ' ' + s + '% ' + pos * 100 + '%'); }
  return {bg: 'linear-gradient(to bottom,' + stops.join(',') + ')', light: segs.every(([id]) => textColor(r.color[id] || '#BBDEFB'))};
}
function currentMap(h) {
  const r = rng();
  if (mode === 'build' && !showSol) return attempt()[h] || {};
  return r.ref[h] || {};
}
function describeMap(r, map) {
  const parts = [];
  for (const a of r.actions) { if (a.id === 'fold') continue; if (map[a.id]) parts.push(a.label + ' ' + fmtFreq(map[a.id])); }
  const fold = 1 - sum(map); if (fold > 0.001) parts.push('Fold ' + fmtFreq(fold));
  return parts.join(', ');
}
function paintCellEl(el, h) {
  const r = rng();
  const hors = r.hors.has(h);
  el.classList.toggle('hors', hors);
  if (hors) { el.style.background = ''; el.classList.remove('light'); }
  else { const st = cellStyle(currentMap(h), r); el.style.background = st.bg; el.classList.toggle('light', st.light); }
  el.classList.toggle('wrong', mode === 'build' && checked && !showSol && wrongSet.has(h));
  el.classList.toggle('sel', h === sel);
  el.setAttribute('aria-label', h + ' : ' + (hors ? 'hors range' : describeMap(r, currentMap(h))));
}
const cellEls = {};
function buildGrid() {
  gridEl.innerHTML = '';
  for (const h of HANDS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cell'; b.dataset.h = h; b.textContent = h.slice(0, 2);
    gridEl.appendChild(b); cellEls[h] = b;
  }
}
function renderGrid() {
  if (!rng()) return;
  for (const h of HANDS) paintCellEl(cellEls[h], h);
  gridEl.classList.toggle('paintable', mode === 'build' && !showSol);
}

/* Table */
function chipsFor(r) {
  const chips = {SB: ['0,5bb', false], BB: ['1bb', false]};
  if (r) for (const e of r.line) chips[e.pos] = [e.action === 'limp' ? 'limp' : (e.action === 'allin' ? 'all-in ' + fmtBB(e.size) + 'bb' : fmtBB(e.size) + 'bb'), true];
  return chips;
}
function seatState(p) {
  if (!hero) return LIST.some(r => r.depth === depth && r.hero === p);
  if (p === hero) return true;
  return LIST.some(r => r.depth === depth && r.hero === hero && r.villain === p);
}
function captionHTML(r) {
  if (!r.line.length) return '<b class="ph">' + r.hero + '</b> ouvre';
  return r.line.map((e, i) => {
    const cls = e.pos === r.hero ? 'ph' : (i === r.line.length - 1 ? 'pv' : '');
    return '<b class="' + cls + '">' + e.pos + '</b> ' + actLabel(e);
  }).join(', ');
}
function renderTable() {
  const live = mode !== 'sim';
  const r = live ? curRange() : sim.range;
  const v = r ? {depth: r.depth, hero: r.hero, villain: r.villain} : {depth, hero, villain};
  const chips = chipsFor(r);
  let h = '<div class="table"><div class="rail"></div><div class="felt"></div>' +
    '<div class="pot">' + (r ? 'Pot total' + NB + ': ' + fmtBB(r.pot) + 'bb' : 'Pot') + '<small>' + v.depth + NB + 'bb</small></div>';
  for (const p of ORDER) {
    const [x, y] = SEATS[p];
    const cls = ['seat']; if (p === v.hero) cls.push('hero'); if (p === v.villain) cls.push('villain');
    if (live && !seatState(p)) cls.push('dim');
    h += '<button type="button" class="' + cls.join(' ') + '" data-seat="' + p + '" style="left:' + x + '%;top:' + y + '%"' +
      (live ? '' : ' tabindex="-1" aria-disabled="true"') + ' aria-label="Position ' + p + (p === v.hero ? ', toi' : '') + (p === v.villain ? ', adversaire' : '') + '">' + p + '</button>';
    if (chips[p]) h += '<span class="bet' + (chips[p][1] ? ' act' : '') + '" style="left:' + x + '%;top:' + (y < 50 ? 36 : 64) + '%">' + chips[p][0] + '</span>';
  }
  h += '</div>';
  if (r) {
    h += '<div class="cap">' + captionHTML(r) + '</div>';
    if (live) {
      const list = rangesFor(r.depth, r.hero, r.villain);
      if (list.length > 1) h += '<div class="sits" role="group" aria-label="Situation">' + list.map(x =>
        '<button type="button" class="sit" data-sit="' + esc(x.key) + '" aria-pressed="' + (x.key === r.key) + '">' + esc(sitLabel(x)) + '</button>').join('') + '</div>';
    }
  }
  tableEl.innerHTML = h;
}
function resetWork() { checked = false; showSol = false; wrongSet = new Set(); sel = 'AA'; brush = null; }
function clickSeat(p) {
  if (mode === 'sim') return;
  if (hero === null) { hero = p; villain = null; }
  else if (p === hero) { if (villain) villain = null; else hero = null; }
  else if (p === villain) villain = null;
  else villain = p;
  sitKey = null; resetWork();
  renderAll();
}

/* Contrôles */
function renderCtl() {
  if (mode === 'sim') {
    const dopt = ['all', ...DEPTHS].map(d => '<option value="' + d + '"' + (String(simCfg.depth) === String(d) ? ' selected' : '') + '>' + (d === 'all' ? 'Toutes' : d + NB + 'bb') + '</option>').join('');
    const topt = CATS.map(([k, l]) => '<option value="' + k + '"' + (simCfg.type === k ? ' selected' : '') + '>' + l + '</option>').join('');
    ctlEl.innerHTML = '<label class="field">Profondeur<select id="simDepth">' + dopt + '</select></label>' +
      '<label class="field">Situations<select id="simType">' + topt + '</select></label>' +
      '<button type="button" class="btn" data-simfold="1" aria-pressed="' + simCfg.noPureFold + '">Sans folds purs</button>';
  } else {
    ctlEl.innerHTML = '<label class="field">Profondeur<select id="depthSel">' + DEPTHS.map(d => '<option value="' + d + '"' + (d === depth ? ' selected' : '') + '>' + d + NB + 'bb</option>').join('') + '</select></label>' +
      '<span class="muted small">Touche ta position, puis celle de l’adversaire.</span>';
  }
}

/* Zone principale */
function emptyHTML() {
  let msg, tags = '';
  if (hero === null) msg = 'Touche ta position sur la table.';
  else if (!villain) {
    const vs = ORDER.filter(p => LIST.some(r => r.depth === depth && r.hero === hero && r.villain === p));
    msg = (vs.length ? 'Pas de range d’open pour ' + hero + ' à ' + depth + NB + 'bb. Touche la position de l’adversaire.' : 'Pas encore de range pour ' + hero + ' à ' + depth + NB + 'bb.');
    if (vs.length) tags = '<div class="tags">' + vs.map(p => '<button type="button" class="tag" data-vil="' + p + '">' + hero + ' vs ' + p + '</button>').join('') + '</div>';
  } else msg = 'Pas de range ' + hero + ' vs ' + villain + ' à ' + depth + NB + 'bb.';
  return '<div class="empty"><h2 class="rtitle">' + (hero ? (villain ? hero + ' vs ' + villain : hero) : 'Aucune position') + '<small>' + depth + NB + 'bb</small></h2><p>' + msg + '</p>' + tags + '</div>';
}
function cardsHTML(cards) {
  return cards.map(c => '<div class="pc s-' + c[1] + '" aria-label="' + c[0] + ' ' + c[1] + '"><b>' + (c[0] === 'T' ? '10' : c[0]) + '</b><i>' + SUIT[c[1]] + '</i></div>').join('');
}
function freqs(r, hand) {
  const m = r.ref[hand] || {}; const f = Object.assign({}, m);
  const fold = Math.max(0, 1 - sum(m)); if (fold > 0.001 || r.actions.some(a => a.id === 'fold')) f.fold = fold;
  return f;
}
function creditFor(r, hand, id) {
  const f = freqs(r, hand); const max = Math.max(...Object.values(f));
  return max > 0 ? (f[id] || 0) / max : 0;
}
function simHTML() {
  if (!sim.range) return '<div class="empty"><p>Aucune situation ne correspond à ces réglages.</p></div>';
  const r = sim.range;
  let h = '<h2 class="rtitle">' + title(r) + '<small>' + r.depth + NB + 'bb</small></h2>' +
    '<div class="deal">' + cardsHTML(sim.cards) + '<div class="dealinfo"><div class="hand">' + sim.hand + '</div><div class="muted small">' + combos(sim.hand) + NB + 'combos</div></div></div>' +
    '<div class="answers">' + r.actions.map(a => {
      let cls = 'ans', mk = '';
      if (sim.answered) {
        const c = creditFor(r, sim.hand, a.id);
        if (c === 1) { cls += ' ok'; mk = '✓'; }
        else if (a.id === sim.choice) { cls += ' ko'; mk = '✗'; }
      }
      return '<button type="button" class="' + cls + '" data-ans="' + a.id + '"' + (sim.answered ? ' disabled' : '') + '>' + swatch(r, a.id) + '<span>' + esc(a.label) + '</span><span class="mk">' + mk + '</span></button>';
    }).join('') + '</div>';
  if (sim.answered) {
    const f = freqs(r, sim.hand);
    const best = Object.keys(f).filter(k => f[k] === Math.max(...Object.values(f)));
    let cls, txt;
    if (sim.credit === 1) { cls = 'ok'; txt = best.length > 1 ? '<b>Correct.</b> Main mixte' + NB + ': les deux actions sont bonnes.' : '<b>Correct.</b>'; }
    else if (sim.credit > 0) { cls = 'part'; txt = '<b>Acceptable</b>, mais ce n’est pas l’action principale.'; }
    else { cls = 'ko'; txt = '<b>Raté.</b>'; }
    h += '<div class="fb ' + cls + '">' + txt + '<div style="margin-top:6px">' + rowsHTML(r, r.ref[sim.hand] || {}) + '</div></div>' +
      '<div class="ctrlrow" style="margin-top:14px"><button type="button" class="btn primary" data-act="next">Main suivante</button></div>';
  }
  return h;
}
function renderMain() {
  if (mode === 'sim') { mtopEl.innerHTML = simHTML(); gridBoxEl.hidden = !(sim.range && sim.answered); return; }
  const r = curRange();
  if (!r) { mtopEl.innerHTML = emptyHTML(); gridBoxEl.hidden = true; return; }
  mtopEl.innerHTML = '<h2 class="rtitle">' + title(r) + '<small>' + r.depth + NB + 'bb</small></h2>';
  gridBoxEl.hidden = false;
}

/* Panneau */
function swatch(r, id) { return '<i class="sw" style="background:' + (r.color[id] || 'var(--c-fold)') + '"></i>'; }
function totals(r, getMap) {
  const tot = {fold: 0}; for (const a of r.actions) tot[a.id] = 0;
  let base = 0;
  for (const h of HANDS) {
    const w = combos(h) * weight(r, h); if (!w) continue;
    base += w; const m = getMap(h); let nf = 0;
    for (const a in m) { tot[a] = (tot[a] || 0) + m[a] * w; nf += m[a]; }
    tot.fold += (1 - nf) * w;
  }
  return {tot, base};
}
function legendHTML(r) {
  const {tot, base} = totals(r, h => r.ref[h] || {});
  const n = r.hors.size;
  return '<div class="block"><h2>Répartition</h2>' + r.actions.map(a =>
    '<div class="leg">' + swatch(r, a.id) + '<span class="name">' + esc(a.label) + '</span><span class="num">' + fmtPct(100 * tot[a.id] / base) + '</span></div>').join('') +
    (n ? '<p class="note">Cases grises' + NB + ': ' + n + ' mains que ' + r.hero + ' ne joue pas à l’action précédente (hors range).</p>' : '') + '</div>';
}
function rowsHTML(r, map) {
  let out = '';
  for (const a of r.actions) { if (a.id === 'fold') continue; if (map[a.id]) out += '<div class="row">' + swatch(r, a.id) + '<span class="name">' + esc(a.label) + '</span><span class="num">' + fmtFreq(map[a.id]) + '</span></div>'; }
  const fold = 1 - sum(map); if (fold > 0.001) out += '<div class="row">' + swatch(r, 'fold') + '<span class="name">Fold</span><span class="num">' + fmtFreq(fold) + '</span></div>';
  return out;
}
function detailHTML(r) {
  const head = '<div class="hand">' + sel + '<small>' + combos(sel) + NB + 'combos</small></div>';
  if (r.hors.has(sel)) return '<div class="block">' + head + '<p class="note">Hors range' + NB + ': ' + r.hero + ' ne joue pas cette main à l’action précédente.</p></div>';
  const part = r.poids[sel] != null ? '<p class="note">' + r.hero + ' ne joue cette main qu’à ' + fmtFreq(r.poids[sel]) + ' à l’action précédente.</p>' : '';
  if (mode === 'build' && checked && !showSol) {
    return '<div class="block">' + head + part + '<div class="cols" style="margin-top:10px"><div><h3>Ta range</h3>' + rowsHTML(r, attempt()[sel] || {}) + '</div><div><h3>Solution</h3>' + rowsHTML(r, r.ref[sel] || {}) + '</div></div></div>';
  }
  return '<div class="block">' + head + part + '<div style="margin-top:8px">' + rowsHTML(r, currentMap(sel)) + '</div></div>';
}
function tagsHTML(list) {
  const max = 36;
  return '<div class="tags">' + list.slice(0, max).map(h => '<button type="button" class="tag" data-tag="' + h + '">' + h + '</button>').join('') +
    (list.length > max ? '<span class="muted small" style="align-self:center">+' + (list.length - max) + '</span>' : '') + '</div>';
}
function userPct() { const r = rng(), att = attempt(); const {tot, base} = totals(r, h => att[h] || {}); return base ? 100 * (base - tot.fold) / base : 0; }
function evaluate() {
  const r = rng(), att = attempt();
  let union = 0, err = 0;
  const missing = [], extra = [], wrong = [];
  for (const h of HANDS) {
    const w = combos(h) * weight(r, h); if (!w) continue;
    const rf = r.ref[h] || {}, u = att[h] || {};
    const rNF = sum(rf), uNF = sum(u);
    let diff = Math.abs(rNF - uNF);
    for (const a of new Set([...Object.keys(rf), ...Object.keys(u)])) diff += Math.abs((rf[a] || 0) - (u[a] || 0));
    const tv = diff / 2;
    if (rNF > 0 || uNF > 0) { union += w; err += w * tv; }
    if (tv > 1e-9) { if (rNF > 0 && uNF === 0) missing.push(h); else if (rNF === 0 && uNF > 0) extra.push(h); else wrong.push(h); }
  }
  const byWeight = (a, b) => combos(b) - combos(a) || HAND_INDEX[a] - HAND_INDEX[b];
  missing.sort(byWeight); extra.sort(byWeight); wrong.sort(byWeight);
  return {score: union ? 100 * (1 - err / union) : 0, missing, extra, wrong};
}
function resultHTML(r) {
  const ev = evaluate(); const s = Math.round(ev.score);
  const best = store.best[r.key];
  const n = ev.missing.length + ev.extra.length + ev.wrong.length;
  let h = '<div class="block"><div class="score"><span class="big">' + s + '</span><span class="pct">%</span></div>' +
    '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, ev.score)) + '%"></i></div>' +
    '<div class="muted small">' + (n === 0 ? 'Range exacte.' : n + (n > 1 ? ' mains à corriger.' : ' main à corriger.')) +
    (best != null ? ' Meilleur score' + NB + ': ' + best + NB + '%.' : '') + '</div>';
  const sect = (t, desc, list) => list.length ? '<div class="err"><b>' + t + '</b> <span class="muted small">(' + list.length + ')</span><div class="muted small">' + desc + '</div>' + tagsHTML(list) + '</div>' : '';
  h += sect('Oubliées', 'À jouer selon la solution, foldées chez toi.', ev.missing);
  h += sect('En trop', 'Jouées chez toi, foldées dans la solution.', ev.extra);
  h += sect('Mauvaise action', 'Jouées des deux côtés, mais pas avec la même action ou fréquence.', ev.wrong);
  h += '<div class="ctrlrow" style="margin-top:12px"><button type="button" class="btn" data-act="sol">' + (showSol ? 'Revenir à ma range' : 'Voir la solution') + '</button></div></div>';
  return h;
}
function orphansHTML() {
  const n = Object.keys(store.orphans || {}).length;
  return n ? '<div class="block"><div class="notice">' + n + (n > 1 ? ' anciens essais n’ont pas pu être rattachés' : ' ancien essai n’a pas pu être rattaché') + ' à une range actuelle. Ils sont conservés dans ce navigateur.</div></div>' : '';
}
function buildHTML(r) {
  const acts = r.actions.filter(a => a.id !== 'fold');
  if (brush == null || (brush !== 'fold' && !acts.some(a => a.id === brush))) brush = acts.length ? acts[0].id : 'fold';
  let h = '<div class="block"><h2>Pinceau</h2><div class="brushes">' + acts.map(a =>
    '<button type="button" class="brush" data-brush="' + a.id + '" aria-pressed="' + (brush === a.id) + '">' + swatch(r, a.id) + '<span>' + esc(a.label) + '</span></button>').join('') +
    '<button type="button" class="brush" data-brush="fold" aria-pressed="' + (brush === 'fold') + '">' + swatch(r, 'fold') + '<span>' + (r.actions.some(a => a.id === 'fold') ? 'Fold (gomme)' : 'Gomme') + '</span></button></div>' +
    '<div class="ctrlrow" style="margin-top:10px"><span class="seg" role="group" aria-label="Fréquence">' +
    '<button type="button" data-freq="1" aria-pressed="' + (brushFreq === 1) + '">100' + NB + '%</button>' +
    '<button type="button" data-freq="0.5" aria-pressed="' + (brushFreq === 0.5) + '">50' + NB + '%</button></span></div>' +
    '<p class="muted small" style="margin:8px 0 0">Touche ou glisse sur les cases. En 50' + NB + '%, la case est coupée en deux avec l’action déjà présente.' + (r.hors.size ? ' Les cases grises sont hors range.' : '') + '</p>' +
    '<div class="ctrlrow" style="margin-top:12px"><button type="button" class="btn primary" data-act="check">Vérifier</button><button type="button" class="btn" data-act="clear">Tout effacer</button></div>' +
    '<div class="muted small" style="margin-top:10px">Ta range' + NB + ': ' + fmtPct(userPct()) + ' des mains.</div></div>';
  if (checked) h += resultHTML(r) + detailHTML(r) +
    '<div class="block"><details><summary>Comment le score est calculé</summary><p class="small muted">Chaque main pèse son nombre de combinaisons (paire 6, suited 4, offsuit 12), multiplié par la fréquence à laquelle tu la joues à l’action précédente. Les mains hors range ne comptent pas. Seules comptent les mains jouées dans la solution ou dans ta range. Le score est la part de ces combinaisons que tu as bien placée, et une case à 50' + NB + '% mal réglée compte pour une demi-erreur.</p></details></div>';
  return h + orphansHTML();
}
function simPanelHTML() {
  const avg = session.n ? Math.round(session.pts / session.n) : null;
  const life = store.sim.n ? Math.round(store.sim.pts / store.sim.n) : null;
  let h = '<div class="block"><h2>Session</h2><div class="score"><span class="big">' + (avg == null ? '–' : avg) + '</span><span class="pct">%</span></div>' +
    '<div class="bar"><i style="width:' + (avg || 0) + '%"></i></div>' +
    '<div class="muted small">' + session.n + (session.n > 1 ? ' mains jouées.' : ' main jouée.') + (life != null ? ' Au total' + NB + ': ' + store.sim.n + ' mains, ' + life + NB + '% de réussite.' : '') + '</div>' +
    '<div class="ctrlrow" style="margin-top:10px"><button type="button" class="btn" data-act="resetsession">Recommencer la session</button></div></div>';
  if (session.log.length) {
    h += '<div class="block"><h2>Dernières mains</h2>' + session.log.slice(0, 8).map(e =>
      '<div class="row hist"><span class="hh">' + e.hand + '</span><span class="name muted small">' + e.title + NB + e.depth + 'bb</span><i class="sw" style="background:' + e.color + '"></i><span>' + esc(e.label) + '</span><span class="num ' + (e.credit === 1 ? 'good' : (e.credit === 0 ? 'badc' : '')) + '" style="min-width:46px;text-align:right">' + Math.round(e.credit * 100) + NB + '%</span></div>').join('') + '</div>';
  }
  return h;
}
function renderPanel() {
  if (mode === 'sim') { panelEl.innerHTML = simPanelHTML(); return; }
  const r = curRange();
  if (!r) { panelEl.innerHTML = ''; return; }
  panelEl.innerHTML = mode === 'view' ? legendHTML(r) + detailHTML(r) : buildHTML(r);
}
function renderAll() {
  for (const m of ['view', 'build', 'sim']) document.getElementById('m-' + m).setAttribute('aria-pressed', mode === m);
  layoutEl.className = 'layout ' + mode;
  renderCtl(); renderTable(); renderMain(); renderGrid(); renderPanel();
}

/* Simulateur */
const rint = n => Math.floor(Math.random() * n);
function simPool() {
  return LIST.filter(r => (simCfg.depth === 'all' || r.depth === simCfg.depth) && (simCfg.type === 'all' || r.cat === simCfg.type));
}
function drawHand(range) {
  let hands = HANDS.filter(h => weight(range, h) > 0);
  if (simCfg.noPureFold) hands = hands.filter(h => sum(range.ref[h] || {}) > 0);
  if (!hands.length) return null;
  let total = 0; hands.forEach(h => total += combos(h) * weight(range, h));
  let t = Math.random() * total, hand = hands[hands.length - 1];
  for (const h of hands) { t -= combos(h) * weight(range, h); if (t < 0) { hand = h; break; } }
  return hand;
}
function deal() {
  const pool = simPool();
  let range = null, hand = null;
  for (let k = 0; k < 20 && pool.length && !hand; k++) { range = pool[rint(pool.length)]; hand = drawHand(range); }
  if (!hand) { sim = {range: null, hand: null, cards: [], answered: false, choice: null, credit: null}; return; }
  const suits = ['s', 'h', 'd', 'c']; let s1, s2;
  if (hand[2] === 's') { s1 = s2 = suits[rint(4)]; }
  else { const a = suits.slice(); s1 = a.splice(rint(4), 1)[0]; s2 = a[rint(3)]; }
  sim = {range, hand, cards: [[hand[0], s1], [hand[1], s2]], answered: false, choice: null, credit: null};
  sel = hand;
}
function answer(id) {
  if (!sim.range || sim.answered) return;
  const r = sim.range, c = creditFor(r, sim.hand, id);
  sim.answered = true; sim.choice = id; sim.credit = c;
  session.n++; session.pts += c * 100;
  session.log.unshift({hand: sim.hand, title: title(r), depth: r.depth, choice: id, color: r.color[id], label: r.actions.find(a => a.id === id).label, credit: c});
  store.sim.n++; store.sim.pts += c * 100; save();
  sel = sim.hand; renderMain(); renderGrid(); renderPanel();
}

/* Peinture */
function dominantOther(cur, brushId) { for (const a in cur) if (a !== brushId && cur[a] >= 0.5) return a; return null; }
function paintHand(h) {
  if (rng().hors.has(h)) return;
  const att = attempt(), cur = att[h] || {}; let next = null;
  if (brush === 'fold') {
    if (brushFreq !== 1) { const k = dominantOther(cur, 'fold'); next = k ? {[k]: 0.5} : null; }
  } else if (brushFreq === 1) next = {[brush]: 1};
  else { const k = dominantOther(cur, brush); next = k ? {[brush]: 0.5, [k]: 0.5} : {[brush]: 0.5}; }
  if (next) att[h] = next; else delete att[h];
  checked = false; wrongSet = new Set(); sel = h;
  for (const x in cellEls) cellEls[x].classList.toggle('sel', x === h);
  paintCellEl(cellEls[h], h);
}
function select(h) {
  const old = cellEls[sel]; sel = h;
  if (old) old.classList.remove('sel');
  cellEls[h].classList.add('sel');
  if (mode !== 'sim') renderPanel();
}
let painting = false, lastHand = null;
gridEl.addEventListener('pointerdown', e => {
  const c = e.target.closest('.cell'); if (!c) return;
  if (mode === 'build' && !showSol) {
    painting = true; lastHand = c.dataset.h; paintHand(lastHand);
    try { gridEl.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  } else select(c.dataset.h);
});
gridEl.addEventListener('pointermove', e => {
  if (!painting) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const c = el && el.closest ? el.closest('.cell') : null;
  if (c && c.dataset.h !== lastHand) { lastHand = c.dataset.h; paintHand(lastHand); }
});
function endPaint() { if (painting) { painting = false; save(); renderGrid(); renderPanel(); } }
window.addEventListener('pointerup', endPaint);
window.addEventListener('pointercancel', endPaint);
gridEl.addEventListener('click', e => {
  if (e.detail !== 0) return;
  const c = e.target.closest('.cell'); if (!c) return;
  if (mode === 'build' && !showSol) { paintHand(c.dataset.h); save(); renderPanel(); } else select(c.dataset.h);
});

/* Événements */
tableEl.addEventListener('click', e => {
  const b = e.target.closest('[data-seat]'); if (b) { clickSeat(b.dataset.seat); return; }
  const s = e.target.closest('[data-sit]'); if (s) { sitKey = s.dataset.sit; resetWork(); renderAll(); }
});
ctlEl.addEventListener('change', e => {
  if (e.target.id === 'depthSel') {
    const old = curRange();
    depth = +e.target.value; resetWork(); sitKey = null;
    if (old) { const same = rangesFor(depth, hero, villain).find(r => r.situation.replace(/[\d,]+bb/g, '') === old.situation.replace(/[\d,]+bb/g, '')); if (same) sitKey = same.key; }
    renderAll();
  }
  else if (e.target.id === 'simDepth') { simCfg.depth = e.target.value === 'all' ? 'all' : +e.target.value; deal(); renderAll(); }
  else if (e.target.id === 'simType') { simCfg.type = e.target.value; deal(); renderAll(); }
});
ctlEl.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.simfold) { simCfg.noPureFold = !simCfg.noPureFold; deal(); renderAll(); }
});
mtopEl.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.ans) answer(t.dataset.ans);
  else if (t.dataset.act === 'next') { deal(); renderAll(); }
  else if (t.dataset.vil) { villain = t.dataset.vil; sitKey = null; resetWork(); renderAll(); }
});
function setMode(m) {
  mode = m; checked = false; showSol = false; wrongSet = new Set(); brush = null;
  if (m === 'sim') { if (!sim.range) deal(); else sel = sim.answered ? sim.hand : sel; } else sel = 'AA';
  renderAll();
}
document.getElementById('m-view').addEventListener('click', () => setMode('view'));
document.getElementById('m-build').addEventListener('click', () => setMode('build'));
document.getElementById('m-sim').addEventListener('click', () => setMode('sim'));
panelEl.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.brush) { brush = t.dataset.brush; renderPanel(); }
  else if (t.dataset.freq) { brushFreq = +t.dataset.freq; renderPanel(); }
  else if (t.dataset.tag) { select(t.dataset.tag); }
  else if (t.dataset.act === 'check') {
    const ev = evaluate(); checked = true; showSol = false;
    wrongSet = new Set([...ev.missing, ...ev.extra, ...ev.wrong]);
    const s = Math.round(ev.score), r = rng();
    if (store.best[r.key] == null || s > store.best[r.key]) store.best[r.key] = s;
    save(); renderGrid(); renderPanel();
  }
  else if (t.dataset.act === 'clear') { store.attempts[rng().key] = {}; checked = false; showSol = false; wrongSet = new Set(); save(); renderGrid(); renderPanel(); }
  else if (t.dataset.act === 'sol') { showSol = !showSol; renderGrid(); renderPanel(); }
  else if (t.dataset.act === 'resetsession') { session = {n: 0, pts: 0, log: []}; renderPanel(); }
});

function start(raw) {
  prepare(raw);
  loadStore();
  if (!DEPTHS.includes(depth)) depth = DEPTHS[0];
  buildGrid(); renderAll();
}
/* Hors ligne : service worker (site publié seulement, sw.js est généré par build.py dans docs/) */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }  // nouvelle version installée
  });
}
if (RAW) start(RAW);
else fetch('data.json').then(r => r.json()).then(start).catch(() => { mtopEl.innerHTML = '<p>Impossible de charger les ranges.</p>'; });
</script>
</body>
